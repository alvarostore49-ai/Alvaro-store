<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Álvaro Store</title>

<link rel="stylesheet" href="style.css">

</head>
<body>

<header>
    <h1>Álvaro Store</h1>
    <input type="text" id="buscar" placeholder="Buscar prenda...">
</header>

<main id="productos">

<div class="producto">
    <div class="codigo">A1</div>

    <img src="1000200720.jpg" alt="Racing Round Sports">

    <h2>Racing Round Sports</h2>

    <p class="precio">C$ 850</p>

    <button onclick="comprar('A1','Racing Round Sports')">
        Comprar
    </button>
</div>

<div class="producto">
    <div class="codigo">A2</div>

    <img src="1000207155.jpg" alt="Hollywood">

    <h2>Hollywood</h2>

    <p class="precio">C$ 850</p>

    <button onclick="comprar('A2','Hollywood')">
        Comprar
    </button>
</div>

<div class="producto">
    <div class="codigo">A3</div>

    <img src="1000210683.jpg" alt="Peace">

    <h2>Peace</h2>

    <p class="precio">C$ 850</p>

    <button onclick="comprar('A3','Peace')">
        Comprar
    </button>
</div>

</main>

<script src="app.js"></script>

</body>
</html>
